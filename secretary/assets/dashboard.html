<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI秘書</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>AI秘書</h1>
      <p id="today-label" class="muted"></p>
    </div>
    <div class="top-tools">
      <button id="brief-button" class="button" type="button" hidden>今日のまとめ</button>
      <div class="search">
        <input id="search" type="search" placeholder="メモ・ノートを検索" autocomplete="off" aria-label="検索">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <span id="live" class="live" title="接続中"></span>
    </div>
  </header>

  <p id="owner" class="owner muted"></p>
  <div id="error" class="error" hidden></div>

  <main class="grid">
    <section class="card todo-card">
      <div class="card-head">
        <h2>今日のTODO</h2>
        <button id="todo-open" class="link" type="button">ファイルを開く</button>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <p id="progress-label" class="muted small"></p>
      <div id="todos"></div>
    </section>

    <section class="card">
      <h2>期限・マイルストーン</h2>
      <ul id="deadlines" class="list"></ul>
    </section>

    <section class="card">
      <h2>この7日間の完了数</h2>
      <div id="week" class="week"></div>
    </section>

    <section class="card">
      <h2>最近のメモ</h2>
      <ul id="memos" class="list"></ul>
    </section>

    <section class="card">
      <h2>最近の判断</h2>
      <ul id="decisions" class="list"></ul>
    </section>

    <section class="card">
      <h2>部署</h2>
      <div id="departments" class="departments"></div>
    </section>

    <section class="card">
      <h2>アイデア（需要検証）</h2>
      <ul id="ideas" class="list"></ul>
    </section>

    <section class="card wide">
      <div class="card-head">
        <h2>アプリの数字（バケツ）</h2>
        <span class="muted small">週ごと・前週比</span>
      </div>
      <div id="analytics"></div>
    </section>

    <section class="card wide">
      <h2>最近更新したファイル</h2>
      <ul id="recent" class="list files"></ul>
    </section>
  </main>

  <dialog id="viewer">
    <div class="viewer-head">
      <div>
        <strong id="viewer-title"></strong>
        <p id="viewer-path" class="muted small"></p>
      </div>
      <button id="viewer-close" class="button" type="button">閉じる</button>
    </div>
    <article id="viewer-body" class="md"></article>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/dashboard.js" type="module"></script>
</body>
</html>
